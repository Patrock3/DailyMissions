<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supabase REST API Test</title>
</head>
<body>
    <h1>Testing Supabase REST API</h1>
    <div id="status">Making Request...</div>

    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            try {
                // Example request to the local API server
                const response = await fetch('/api/pat_users');

                const data = await response.json();
                document.getElementById('status').textContent = 'Request successful: ' + JSON.stringify(data);
                console.log('Request successful:', data);
            } catch (error) {
                document.getElementById('status').textContent = 'Error making request: ' + error.message;
                console.error('Error making request:', error.message);
            }
        });
    </script>
</body>
</html>
